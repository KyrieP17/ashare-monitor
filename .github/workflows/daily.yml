name: 每日扫盘

on:
  schedule:
    # 每交易日 15:35 北京时间（A股收盘后）= 07:35 UTC
    - cron: '35 7 * * 1-5'
    # 每交易日 21:10 北京时间（美股盘前）= 13:10 UTC
    - cron: '10 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 拉取数据
        run: |
          python fetch_data.py --force
          python limit_up_scan.py
          python us_market.py
      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/pool_cache/*.json
          git diff --cached --quiet || git commit -m "data: 每日扫盘 $(date -u +%Y-%m-%d)"
          git push
